<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jasmine's Birthday Invitation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Great+Vibes&family=Lobster&display=swap" rel="stylesheet">

    <script src="script.js"></script>

</head>
<body>
    <div class="container text-center">
        <div class="card">
            <img src="/IMG_1603.jpeg" alt="Birthday Candles" class="img-fluid rounded">
            <div class="card-body">
                <h1 class="card-title">You are invited to celebrate Jasmine’s Birthday!</h1>
                <p class="card-text">May 24th, 2:30pm - 5:30pm</p>
                <p class="card-text">@ Boardroom, Wimbledon Quarter, Wimbledon</p>
                <button type="button" class="btn btn-primary mt-3" id="rsvpButton">RSVP</button>
            </div>
        </div>

        <div class="mt-4">
            <h2>Friends Who Are Coming:</h2>
            <ul id="guestList" class="list-group">
                </ul>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
